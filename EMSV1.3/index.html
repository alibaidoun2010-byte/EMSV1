<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- إضافة في الـ head -->
  
  <link rel="icon" type="image/x-icon" href="icon.png?v=1.0">
  <meta name="theme-color" content="#ff5722">
  <meta charset="UTF-8">
  <title>مطعمي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/in.css">
</head>
<body>
  <!-- شاشة البداية -->
  <div id="splash">
    <!-- بدلاً من <img id="splashLogo" src="..." /> -->
<div id="splashLogo"></div>
  </div>

 
 <!-- القائمة الجانبية -->
<div id="sidebar" class="sidebar">
  <img id="sidebarLogo" alt="لوغو">
  
  

  <!-- Developer Button -->
  <a href="developer.html" class="sidebar-item">
    <span class="text">عن المطور</span>
    <img
      src="assets/images/info.png"
      alt="Developer"
      class="sidebar-icon"
    >
  </a>

  <!-- Rating Button -->
  <a href="rate.html" class="sidebar-item">
    <span class="text">التقييم</span>
    <span class="sidebar-icon sidebar-icon-svg" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3.5l2.6 5.27 5.82.85-4.21 4.1.99 5.78L12 16.77l-5.2 2.73.99-5.78-4.21-4.1 5.82-.85L12 3.5z"
          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor" fill-opacity="0.15"/>
      </svg>
    </span>
  </a>


 
</div>

  <!-- الصفحة الرئيسية -->
  <div id="main">
    <div class="menu-btn" onclick="toggleSidebar()">
      <span class="bar bar1"></span>
      <span class="bar bar2"></span>
      <span class="bar bar3"></span>

    </div>

    <!-- ترويسة المطعم: اللوغو + أزرار التواصل -->
    <header class="brand-header">
      <div class="brand-identity">
        <img id="headerLogo" class="brand-logo" src="assets/images/garden.jpg" alt="لوغو مطعم Garden">
        <div class="brand-titles">
          <h1 class="brand-name">Garden</h1>
          <span class="brand-tagline"></span>
        </div>
      </div>
      <div class="brand-social">
        <a class="social-btn instagram" id="instagramLink" href="https://www.instagram.com/garden_damascus?igsh=eXAyOHAzYmFyOGw3" target="_blank" rel="noopener" aria-label="إنستغرام">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
          </svg>
        </a>
        <a class="social-btn facebook" id="facebookLink" href="https://www.facebook.com/share/1HRYj34cTk/" target="_blank" rel="noopener" aria-label="فيسبوك">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.5 8.5h2.2V5.6h-2.4c-2.4 0-3.9 1.5-3.9 3.9v1.6H8.2v2.9h2.2V21h3.1v-7h2.3l.4-2.9h-2.7v-1.3c0-.9.3-1.3 1-1.3z"
              fill="currentColor"/>
          </svg>
        </a>
      </div>
    </header>

    <!-- شريط الصور المتحرك -->
    <div class="slider" id="imageSlider">
      <div class="slider-track" id="sliderTrack"></div>
      <div class="slider-dots" id="sliderDots"></div>
    </div>

    <div class="tabs" id="tabsContainer">
      <!-- tabs will be rendered here dynamically -->
      <div class="indicator" id="tabsIndicator"></div>
    </div>

    <div id="content">
      
      <!-- سيتم تحميل العناصر من Supabase -->
      <p id="emptyHint" style="color:#666;">جارٍ تحميل القوائم...</p>
    </div>
  </div>

  <!-- زر طلبي عصري -->
<button class="floating-btn" id="orderBtn">
  <span class="cart-text">طلبي</span>
  <img src="assets/images/carticon3.png" alt="سلة التسوق">
  <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
</button>

  <!-- نافذة الطلب -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h2>ملخص الطلب</h2>
      <div id="orderItems"></div>
      <!--input type="number" id="tableNumber" placeholder="رقم الطاولة"-->
      <!--textarea id="orderNotes" placeholder="ملاحظات"></textarea-->

      <!--button id="sendOrderBtn">إرسال الطلب</button-->

    </div>
  </div>

  <!-- نافذة تثبيت التطبيق -->
<div class="install-modal" id="installModal">
  <div class="install-content">
    <div class="install-icon">
      <img id="installLogo" alt="لوغو المطعم">
    </div>
    <div class="install-title">تثبيت التطبيق</div>
    <div class="install-text">
      ثبّت التطبيق على جهازك لتستفيد من خدمات حجز الطاولة و التقييم !
      <br><br>
      <small>سيتم إضافة أيقونة التطبيق إلى شاشتك الرئيسية</small>
    </div>
    <div class="install-buttons">
      <div id="installMessage" class="message"></div>
      <button class="install-btn" id="confirmInstall">تثبيت التطبيق</button>
      <button class="install-btn secondary" id="cancelInstall">لاحقاً</button>

    </div>
  </div>
</div>
<script type="module" src="js/in.js"></script>
</body>
</html>
